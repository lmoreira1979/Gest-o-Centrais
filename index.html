<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de Centrais</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#17365d;color:#fff;padding:18px 22px}
main{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #0001}
input,button{font-size:16px;padding:11px;border-radius:7px}
input{width:100%;box-sizing:border-box;border:1px solid #bbb}
button{border:0;background:#17365d;color:#fff;cursor:pointer;margin-top:10px}
.status{padding:12px;border-radius:7px;background:#eef2f6;margin-top:15px}
.error{background:#fdecec;color:#9b1c1c}
.ok{background:#eaf7ea;color:#216b21}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd}
.muted{color:#666}
.hidden{display:none}
.search-wrap{position:relative}
.suggestions{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #bbb;border-top:0;border-radius:0 0 7px 7px;max-height:260px;overflow-y:auto;z-index:20;box-shadow:0 4px 10px #0002}
.suggestion{padding:12px;cursor:pointer;border-bottom:1px solid #eee}
.suggestion:hover,.suggestion.active{background:#eef2f6}
</style>
</head>
<body>
<header><h1>Gestão de Centrais</h1></header>
<main>
<div class="card">
<h2>Pesquisar central</h2>
<p class="muted">Escreva parte do nome. A pesquisa não distingue maiúsculas de minúsculas.</p>
<div class="search-wrap">
<input id="centralInput" autocomplete="off" placeholder="Ex.: CEN, B, Ed. A...">
<div id="suggestions" class="suggestions hidden"></div>
</div>
<button id="searchBtn">Abrir central</button>
<div id="status" class="status">A carregar as centrais...</div>
</div>

<div id="ficha" class="card hidden">
<h2 id="nomeCentral"></h2>
<div id="dadosCentral"></div>
<h3>Zonas</h3><div id="zonas">A carregar...</div>
<h3>Equipamentos</h3><div id="equipamentos">A carregar...</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://uycjgxnzkkibadxvbiyy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5QFb8wU3xSjTFDbs_Ty-aw_X_Tlmq2-";

const statusEl=document.getElementById("status");
const fichaEl=document.getElementById("ficha");
const inputEl=document.getElementById("centralInput");
const suggestionsEl=document.getElementById("suggestions");
let centrais=[];
let filtered=[];
let activeIndex=-1;

function status(t,c=""){statusEl.textContent=t;statusEl.className="status "+c}
function normalizar(v){
  return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))
}

if(!window.supabase) status("Não foi possível carregar a biblioteca do Supabase.","error");
const db=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

async function carregarListaCentrais(){
  if(!db){status("A ligação ao Supabase não está disponível.","error");return}
  try{
    const {data,error}=await db.from("centrais").select("id_central").order("id_central");
    if(error) throw error;
    centrais=data||[];
    status(centrais.length+" centrais disponíveis. Comece a escrever para pesquisar.","ok");
  }catch(e){
    status("Não foi possível carregar a lista de centrais: "+(e.message||e),"error");
  }
}

function mostrarSugestoes(){
  const termo=normalizar(inputEl.value);
  activeIndex=-1;
  if(!termo || !centrais.length){
    suggestionsEl.classList.add("hidden");
    suggestionsEl.innerHTML="";
    return;
  }

  const exatas=centrais.filter(c=>normalizar(c.id_central).startsWith(termo));
  const restantes=centrais.filter(c=>{
    const n=normalizar(c.id_central);
    return n.includes(termo) && !n.startsWith(termo);
  });
  filtered=[...exatas,...restantes].slice(0,12);

  if(!filtered.length){
    suggestionsEl.innerHTML='<div class="suggestion muted">Nenhuma central encontrada.</div>';
    suggestionsEl.classList.remove("hidden");
    return;
  }

  suggestionsEl.innerHTML=filtered.map((c,i)=>
    '<div class="suggestion" data-index="'+i+'">'+esc(c.id_central)+'</div>'
  ).join("");
  suggestionsEl.classList.remove("hidden");

  suggestionsEl.querySelectorAll(".suggestion").forEach(el=>{
    el.addEventListener("mousedown",e=>{
      e.preventDefault();
      const c=filtered[Number(el.dataset.index)];
      inputEl.value=c.id_central;
      suggestionsEl.classList.add("hidden");
      abrirCentral(c.id_central);
    });
  });
}

async function abrirCentral(valor){
  const pesquisa=String(valor??inputEl.value).trim();
  fichaEl.classList.add("hidden");
  suggestionsEl.classList.add("hidden");

  if(!pesquisa){status("Escreva o nome de uma central.","error");return}
  if(!db){status("A ligação ao Supabase não está disponível.","error");return}
  if(SUPABASE_ANON_KEY==="COLOQUE_AQUI_A_SUA_PUBLISHABLE_KEY"){
    status("Falta colocar a Publishable Key no index.html.","error");return
  }

  status("A procurar a central...");
  try{
    const {data,error}=await db.from("centrais").select("*").ilike("id_central","%"+pesquisa+"%").limit(1);
    if(error) throw error;
    if(!data||!data.length){status("Central não encontrada: "+pesquisa,"error");return}

    const c=data[0];
    inputEl.value=c.id_central||pesquisa;
    document.getElementById("nomeCentral").textContent=c.id_central||c.nome||"Central";
    const campos=Object.entries(c)
      .filter(([k,v])=>v!==null&&v!=="")
      .map(([k,v])=>"<tr><th>"+esc(k)+"</th><td>"+esc(v)+"</td></tr>").join("");
    document.getElementById("dadosCentral").innerHTML="<table>"+campos+"</table>";

    await carregarZonas(c);
    await carregarEquipamentos(c);

    fichaEl.classList.remove("hidden");
    status("Central encontrada.","ok");
  }catch(e){
    console.error(e);
    status("Erro ao consultar o Supabase: "+(e.message||e),"error");
  }
}

async function carregarZonas(c){
  const el=document.getElementById("zonas"), id=c.id_central??c.id;
  try{
    let q=db.from("zonas").select("*");
    if(id!=null) q=q.eq("id_central",id);
    const {data,error}=await q;
    if(error)throw error;
    if(!data?.length){
      el.innerHTML="<p class='muted'>Sem zonas registadas para esta central.</p>";
      return;
    }
    el.innerHTML="<table><tr><th>Zona</th><th>Designação</th><th>Área/Piso</th><th>Estado</th></tr>"+
      data.map(z=>"<tr><td>"+esc(z.numero_zona)+"</td><td>"+esc(z.designacao)+"</td><td>"+esc(z.piso_area)+"</td><td>"+esc(z.estado)+"</td></tr>").join("")+
      "</table>";
  }catch(e){
    el.innerHTML="<p class='error'>Não foi possível carregar as zonas: "+esc(e.message||e)+"</p>";
  }
}

async function carregarEquipamentos(c){
  const el=document.getElementById("equipamentos"), id=c.id_central??c.id;
  try{
    let q=db.from("equipamentos_zona").select("*");
    if(id!=null) q=q.eq("id_central",id);
    const {data,error}=await q;
    if(error)throw error;
    if(!data?.length){
      el.innerHTML="<p class='muted'>Sem equipamentos associados nesta tabela.</p>";
      return;
    }
    const cols=Object.keys(data[0]);
    el.innerHTML="<table><tr>"+cols.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr>"+
      data.map(r=>"<tr>"+cols.map(x=>"<td>"+esc(r[x])+"</td>").join("")+"</tr>").join("")+
      "</table>";
  }catch(e){
    el.innerHTML="<p class='error'>Não foi possível carregar os equipamentos: "+esc(e.message||e)+"</p>";
  }
}

inputEl.addEventListener("input",mostrarSugestoes);

inputEl.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){
    if(filtered.length){
      e.preventDefault();
      activeIndex=(activeIndex+1)%filtered.length;
      suggestionsEl.querySelectorAll(".suggestion").forEach((el,i)=>el.classList.toggle("active",i===activeIndex));
    }
    return;
  }
  if(e.key==="ArrowUp"){
    if(filtered.length){
      e.preventDefault();
      activeIndex=(activeIndex-1+filtered.length)%filtered.length;
      suggestionsEl.querySelectorAll(".suggestion").forEach((el,i)=>el.classList.toggle("active",i===activeIndex));
    }
    return;
  }
  if(e.key==="Enter"){
    e.preventDefault();
    if(activeIndex>=0 && filtered[activeIndex]){
      inputEl.value=filtered[activeIndex].id_central;
      suggestionsEl.classList.add("hidden");
      abrirCentral(filtered[activeIndex].id_central);
    }else{
      abrirCentral();
    }
  }
  if(e.key==="Escape"){
    suggestionsEl.classList.add("hidden");
  }
});

document.addEventListener("click",e=>{
  if(!e.target.closest(".search-wrap")) suggestionsEl.classList.add("hidden");
});

document.getElementById("searchBtn").addEventListener("click",()=>abrirCentral());
carregarListaCentrais();
</script>
</body>
</html>
