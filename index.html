<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gestão de Centrais</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#17324d;background:#f4f6f8}
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6f8}
    header{background:#173b63;color:#fff;padding:14px 22px;font-weight:700}
    main{max-width:900px;margin:22px auto;padding:0 14px}
    .card{background:#fff;border:1px solid #dfe4ea;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px #00000008}
    h1{font-size:22px;margin:0 0 4px}
    h2{font-size:17px;margin:0 0 12px}
    .muted{color:#6b7785;font-size:13px}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
    .search-row{display:flex;gap:8px}
    input{width:100%;padding:11px 12px;border:1px solid #aeb8c4;border-radius:6px;font-size:15px}
    button{border:0;border-radius:6px;padding:10px 15px;background:#173b63;color:#fff;cursor:pointer}
    button.secondary{background:#e9eef4;color:#17324d}
    button:hover{filter:brightness(.96)}
    #suggestions{margin-top:6px;border:1px solid #d8dee6;border-radius:7px;overflow:hidden;display:none;background:#fff}
    .suggestion{padding:10px 12px;border-bottom:1px solid #edf0f3;cursor:pointer}
    .suggestion:last-child{border-bottom:0}
    .suggestion:hover{background:#f1f6fb}
    .status{padding:9px 11px;border-radius:6px;margin-top:10px;font-size:13px}
    .ok{background:#e8f7e8;color:#28712d}
    .warn{background:#fff5d9;color:#805d00}
    .err{background:#fde9e9;color:#a12626}
    .hidden{display:none!important}
    .title-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .central-title{font-size:21px;font-weight:700;margin-bottom:4px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
    .field{padding:8px 0;border-bottom:1px solid #e7ebef;display:grid;grid-template-columns:42% 58%;font-size:13px}
    .field b{font-weight:600;color:#617080}
    .field span{overflow-wrap:anywhere}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{text-align:left;padding:8px;border-bottom:1px solid #e3e8ed;vertical-align:top}
    th{background:#f3f6f9}
    .badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}
    .badge.ok{background:#dff5df}
    .badge.warn{background:#fff0c2}
    .badge.bad{background:#f9dcdc}
    .empty{padding:10px;background:#f7f8fa;border-radius:6px;color:#687482;font-size:13px}
    .photo{max-width:100%;max-height:320px;border-radius:8px;border:1px solid #dce2e8;margin-top:8px}
    @media(max-width:650px){.grid{grid-template-columns:1fr}.search-row{flex-direction:column}.title-row{flex-direction:column}}
  </style>
</head>
<body>
<header>Gestão de Centrais</header>

<main>
  <section class="card">
    <h1>Pesquisar central</h1>
    <div class="muted">Escreva parte do nome/código. A pesquisa não distingue maiúsculas de minúsculas.</div>

    <div style="margin-top:12px">
      <label for="search">Central</label>
      <div class="search-row">
        <input id="search" autocomplete="off" placeholder="Ex.: cen, CEN-Ed. A, B...">
        <button id="openBtn" type="button">Abrir central</button>
      </div>
      <div id="suggestions"></div>
    </div>

    <div id="message" class="status hidden"></div>
  </section>

  <section id="result" class="hidden"></section>
</main>

<script>
/* ============================================================
   SUPABASE
   ============================================================
   URL do projeto:
   https://uycjgxnzkkibadxvbiyy.supabase.co

   IMPORTANTE:
   Cole aqui a sua SB PUBLISHABLE KEY (a chave pública).
   NÃO use a Secret Key.
   ============================================================ */

const SUPABASE_URL = "https://uycjgxnzkkibadxvbiyy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5QFb8wU3xSjTFDbs_Ty-aw_X_Tlmq2-";

const searchEl = document.getElementById("search");
const suggestionsEl = document.getElementById("suggestions");
const messageEl = document.getElementById("message");
const resultEl = document.getElementById("result");
const openBtn = document.getElementById("openBtn");

let centrais = [];
let selectedCentral = null;

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showMessage(text,type="ok"){
  messageEl.textContent=text;
  messageEl.className="status "+type;
}

function hideMessage(){ messageEl.className="status hidden"; }

function isConfigured(){
  return SUPABASE_URL && SUPABASE_ANON_KEY &&
         !SUPABASE_ANON_KEY.includes("COLE_AQUI");
}

async function supabaseGet(table, params=""){
  const url = `${SUPABASE_URL}/rest/v1/${table}${params}`;
  const response = await fetch(url,{
    method:"GET",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
      "Accept":"application/json"
    }
  });

  if(!response.ok){
    const text = await response.text();
    throw new Error(`${response.status} ${text}`);
  }
  return response.json();
}

/*
  Carregamos a tabela centrais sem referir "designacao".
  Assim evitamos o erro:
  "column centrais.designacao does not exist".

  A pesquisa usa os campos que existem na tabela e compara
  tudo em minúsculas, permitindo pesquisar sem maiúsculas.
*/
async function loadCentrais(){
  if(!isConfigured()){
    showMessage("Falta colocar a SB Publishable Key no index.html.","err");
    return;
  }

  try{
    showMessage("A carregar centrais...","ok");
    const data = await supabaseGet("centrais","?select=*");
    centrais = Array.isArray(data) ? data : [];
    hideMessage();
  }catch(error){
    console.error(error);
    showMessage("Erro ao consultar o Supabase: "+error.message,"err");
  }
}

function centralLabel(c){
  return c.id_central || c.codigo_referencia || c.local_instalacao || "Central";
}

function centralSearchText(c){
  return Object.values(c).filter(v => v !== null && v !== undefined)
    .map(v => String(v)).join(" ").toLowerCase();
}

function findMatches(term){
  const q=term.trim().toLowerCase();
  if(!q) return centrais.slice(0,20);

  return centrais
    .filter(c => centralSearchText(c).includes(q))
    .sort((a,b)=>{
      const aa=centralLabel(a).toLowerCase();
      const bb=centralLabel(b).toLowerCase();
      const ap=aa.startsWith(q)?0:1;
      const bp=bb.startsWith(q)?0:1;
      return ap-bp || aa.localeCompare(bb,"pt");
    })
    .slice(0,20);
}

function renderSuggestions(items){
  suggestionsEl.innerHTML="";
  if(!items.length){
    suggestionsEl.style.display="none";
    return;
  }

  items.forEach(c=>{
    const div=document.createElement("div");
    div.className="suggestion";
    div.innerHTML=`<strong>${esc(centralLabel(c))}</strong>
      <div class="muted">${esc(c.local_instalacao || c.codigo_referencia || "")}</div>`;
    div.addEventListener("mousedown",(ev)=>{
      ev.preventDefault();
      selectedCentral=c;
      searchEl.value=centralLabel(c);
      suggestionsEl.style.display="none";
    });
    suggestionsEl.appendChild(div);
  });
  suggestionsEl.style.display="block";
}

searchEl.addEventListener("input",()=>{
  selectedCentral=null;
  renderSuggestions(findMatches(searchEl.value));
});

searchEl.addEventListener("focus",()=>{
  renderSuggestions(findMatches(searchEl.value));
});

document.addEventListener("click",(e)=>{
  if(!e.target.closest("#search") && !e.target.closest("#suggestions")){
    suggestionsEl.style.display="none";
  }
});

async function openSelected(){
  const term=searchEl.value.trim();

  if(selectedCentral){
    await showCentral(selectedCentral);
    return;
  }

  const matches=findMatches(term);

  if(!term){
    showMessage("Escreva o nome ou código da central.","warn");
    return;
  }

  if(matches.length===1){
    await showCentral(matches[0]);
  }else if(matches.length>1){
    renderSuggestions(matches);
    showMessage("Existem várias correspondências. Escolha uma das sugestões.","warn");
  }else{
    showMessage("Central não encontrada.","warn");
  }
}

openBtn.addEventListener("click",openSelected);
searchEl.addEventListener("keydown",e=>{
  if(e.key==="Enter") openSelected();
});

function prettyLabel(key){
  const labels={
    id_central:"ID central",
    codigo_referencia:"Código referência",
    local_instalacao:"Local instalação",
    morada:"Morada",
    fabricante:"Fabricante",
    modelo:"Modelo",
    numero_serie:"Número de série",
    tipo_central:"Tipo central",
    estado:"Estado",
    ultima_manutencao:"Última manutenção",
    proxima_manutencao:"Próxima manutenção",
    observacoes:"Observações",
    fotografia_url:"Fotografia"
  };
  return labels[key] || key.replaceAll("_"," ");
}

function formatValue(key,value){
  if(value===null || value===undefined || value==="") return "—";
  if((key==="ultima_manutencao" || key==="proxima_manutencao") &&
     /^\\d{4}-\\d{2}-\\d{2}/.test(String(value))){
    const [y,m,d]=String(value).slice(0,10).split("-");
    return `${d}/${m}/${y}`;
  }
  if(typeof value==="object") return JSON.stringify(value);
  return String(value);
}

function statusBadge(value){
  const s=String(value||"").toLowerCase();
  if(["ativa","ativo","ok","normal"].includes(s))
    return `<span class="badge ok">${esc(value)}</span>`;
  if(["inativa","inativo","avaria","anómala","anomalia"].some(x=>s.includes(x)))
    return `<span class="badge bad">${esc(value)}</span>`;
  return `<span class="badge warn">${esc(value || "—")}</span>`;
}

async function loadRelated(table,idCentral){
  try{
    const rows=await supabaseGet(
      table,
      `?id_central=eq.${encodeURIComponent(idCentral)}&select=*`
    );
    return Array.isArray(rows)?rows:[];
  }catch(error){
    console.warn(`Não foi possível carregar ${table}:`,error);
    return [];
  }
}

function renderTable(rows, title){
  if(!rows.length) return `
    <section class="card">
      <h2>${esc(title)}</h2>
      <div class="empty">Sem registos associados.</div>
    </section>`;

  const keys=[];
  rows.forEach(r=>Object.keys(r).forEach(k=>{
    if(!keys.includes(k)) keys.push(k);
  }));

  const shownKeys=keys.filter(k=>k!=="created_at" && k!=="updated_at");

  return `
    <section class="card">
      <h2>${esc(title)}</h2>
      <div style="overflow:auto">
        <table>
          <thead><tr>${shownKeys.map(k=>`<th>${esc(prettyLabel(k))}</th>`).join("")}</tr></thead>
          <tbody>
            ${rows.map(r=>`<tr>${shownKeys.map(k=>`<td>${esc(formatValue(k,r[k]))}</td>`).join("")}</tr>`).join("")}
          </tbody>
        </table>
      </div>
    </section>`;
}

async function showCentral(c){
  selectedCentral=c;
  suggestionsEl.style.display="none";
  hideMessage();

  const id=c.id_central;
  if(!id){
    showMessage("A central não tem id_central.","err");
    return;
  }

  resultEl.classList.remove("hidden");
  resultEl.innerHTML=`
    <section class="card">
      <div class="title-row">
        <div>
          <div class="central-title">${esc(centralLabel(c))}</div>
          <div class="muted">${esc(c.local_instalacao || "")}</div>
        </div>
        <button class="secondary" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">Voltar à pesquisa</button>
      </div>
      <div class="grid" style="margin-top:14px">
        ${Object.entries(c)
          .filter(([k])=>k!=="created_at" && k!=="updated_at" && k!=="fotografia_url")
          .map(([k,v])=>`
            <div class="field">
              <b>${esc(prettyLabel(k))}</b>
              <span>${k==="estado" ? statusBadge(v) : esc(formatValue(k,v))}</span>
            </div>`).join("")}
      </div>
      ${c.fotografia_url ? `<div style="margin-top:14px"><b>Fotografia</b><br>
        <img class="photo" src="${esc(c.fotografia_url)}" alt="Fotografia da central"
             onerror="this.style.display='none'"></div>` : ""}
    </section>
    <div id="relatedLoading" class="card muted">A carregar zonas, equipamentos e manutenções...</div>
    <div id="related"></div>
  `;

  const [zonas,equipamentos,manutencoes,intervencoes]=await Promise.all([
    loadRelated("zonas",id),
    loadRelated("equipamentos",id),
    loadRelated("manutencoes",id),
    loadRelated("intervencoes",id)
  ]);

  document.getElementById("relatedLoading")?.remove();
  const related=document.getElementById("related");
  if(related){
    related.innerHTML =
      renderTable(zonas,"Zonas") +
      renderTable(equipamentos,"Equipamentos") +
      renderTable(manutencoes,"Manutenções") +
      renderTable(intervencoes,"Intervenções");
  }
}

loadCentrais();
</script>
</body>
</html>
