<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f4e78"><link rel="manifest" href="manifest.json"><title>Gestão de Centrais</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f6f8;color:#17365d}header{background:#1f4e78;color:#fff;padding:16px}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #0001}button{background:#1f4e78;color:#fff;border:0;border-radius:8px;padding:11px 14px;cursor:pointer}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd5dc;border-radius:7px;margin:5px 0 12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.badge{display:inline-block;padding:6px 10px;border-radius:20px;font-weight:bold}.ok{background:#e2f0d9;color:#38761d}.warn{background:#fff2cc;color:#8a6500}.bad{background:#f4cccc;color:#a61c00}.small{font-size:13px;color:#667}.hidden{display:none}.photo{width:100%;max-height:420px;object-fit:contain;border-radius:10px;background:#eee}.event{border-left:5px solid #5b9bd5;padding:10px;margin:8px 0;background:#f7fafc}</style></head><body><header><div class="wrap"><h1>Gestão de Centrais de Deteção de Incêndio</h1></div></header><div class="wrap"><section id="home"><div class="card"><h2>Centrais</h2><input id="search" placeholder="Pesquisar central..." oninput="renderList()"><div id="list"></div></div></section><section id="detail" class="hidden"><button onclick="goHome()">← Centrais</button><div class="card"><h2 id="ctitle"></h2><div id="cstatus"></div><div id="cinfo"></div></div><div class="card"><h3>Fotografia da central</h3><img id="photo" class="photo hidden"><input id="photoIn" type="file" accept="image/*" capture="environment" onchange="photo(event)"></div><div class="card"><h3>Próxima manutenção</h3><input id="next" type="date" onchange="setNext(this.value)"></div><div class="card"><h3>Registar ocorrência / intervenção</h3><select id="kind"><option>Anomalia</option><option>Manutenção</option><option>Reparação</option><option>Observação</option></select><textarea id="desc" rows="4" placeholder="Descrição"></textarea><button onclick="addEvent()">Guardar</button></div><div class="card"><h3>Histórico</h3><div id="history"></div></div></section></div><script>
const CENTRALS=["CEN-Ed. A", "CEN-Ed. B", "CEN-Ed. C", "CEN-Ed. D", "CEN-Ed. E", "CEN-Esc. TRS.", "CEN-Rec. Geral", "CEN-Serralharia", "CEN-REEE's", "CEN-VFV's", "CEN-CDR TRS", "CEN-SOL MAIA", "CEN-TSC MAIA", "CEN-EXT MAIA", "CEN-Esc. SET", "CEN-Arm. SET", "CEN-Esc. SERV", "CEN-Arm. SERV"];let db=JSON.parse(localStorage.getItem('centraisApp')||'{}'),current=null;CENTRALS.forEach(id=>{if(!db[id])db[id]={next:'',photo:'',events:[]}});save();function save(){localStorage.setItem('centraisApp',JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function state(c){if(c.events.some(e=>e.kind==='Anomalia'||e.kind==='Reparação'))return['ANOMALIA','bad'];if(!c.next)return['SEM DATA','bad'];let x=(new Date(c.next+'T00:00:00')-new Date())/86400000;if(x<0)return['VENCIDA','bad'];if(x<=30)return['PRÓXIMA','warn'];return['OK','ok']}function renderList(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('list').innerHTML=CENTRALS.filter(x=>x.toLowerCase().includes(q)).map(id=>{let c=db[id],s=state(c);return `<div class="card"><div class="row"><div><b>${esc(id)}</b><div class="small">Próxima manutenção: ${c.next?new Date(c.next+'T00:00:00').toLocaleDateString('pt-PT'):'Não definida'}</div></div><span class="badge ${s[1]}">${s[0]}</span><button onclick="openCentral(${JSON.stringify(id)})">Abrir</button></div></div>`}).join('')}function openCentral(id){current=id;let c=db[id],s=state(c);home.classList.add('hidden');detail.classList.remove('hidden');ctitle.textContent=id;cstatus.innerHTML='<span class="badge '+s[1]+'">'+s[0]+'</span>';next.value=c.next||'';cinfo.innerHTML='<p><b>Identificador:</b> CENTRAL:'+esc(id)+'</p>';photoEl=document.getElementById('photo');photoEl.src=c.photo||'';photoEl.classList.toggle('hidden',!c.photo);renderHistory()}function goHome(){detail.classList.add('hidden');home.classList.remove('hidden');renderList()}function setNext(v){db[current].next=v;save();openCentral(current)}function photo(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db[current].photo=r.result;save();openCentral(current)};r.readAsDataURL(f)}function addEvent(){let d=desc.value.trim();if(!d)return alert('Introduza uma descrição.');db[current].events.unshift({date:new Date().toISOString(),kind:kind.value,desc:d});save();desc.value='';openCentral(current)}function renderHistory(){history.innerHTML=db[current].events.length?db[current].events.map(e=>`<div class="event"><b>${esc(e.kind)}</b><div class="small">${new Date(e.date).toLocaleString('pt-PT')}</div><div>${esc(e.desc)}</div></div>`).join(''):'<div class="small">Sem registos.</div>'}const wanted=new URLSearchParams(location.search).get('central');if(wanted&&CENTRALS.includes(wanted))openCentral(wanted);else renderList();
</script></body></html>
