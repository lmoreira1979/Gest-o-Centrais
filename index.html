<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Gestão de Centrais</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#17202a;background:#f4f6f8}
    *{box-sizing:border-box} body{margin:0}.wrap{max-width:900px;margin:auto;padding:16px}
    header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
    h1{font-size:1.35rem;margin:0}.muted{color:#6b7280}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0000000b}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{padding:12px;border-radius:10px;background:#f7f7f7}
    .label{font-size:.78rem;color:#6b7280}.value{font-weight:650;margin-top:3px}
    button,input,select,textarea{font:inherit} button{border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
    .primary{background:#1f6feb;color:#fff}.secondary{background:#e9eef5}.danger{background:#b42318;color:#fff}
    input,select,textarea{width:100%;padding:10px;border:1px solid #cfd5dc;border-radius:9px;background:#fff}
    textarea{min-height:90px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.status{display:inline-flex;padding:6px 10px;border-radius:999px;font-weight:700;font-size:.85rem}
    .ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.late{background:#fee2e2;color:#991b1b}.nodate{background:#e5e7eb;color:#374151}
    .photo{width:100%;max-height:300px;object-fit:cover;border-radius:12px}.hidden{display:none!important}
    .list button{width:100%;text-align:left;background:#f8fafc;margin:4px 0;border:1px solid #e5e7eb}
    #reader{max-width:420px;margin:10px auto}.small{font-size:.85rem}
    .top-actions{display:flex;gap:8px;align-items:center;justify-content:space-between}
  </style>
</head>
<body>
<header><div class="wrap top-actions">
  <div><h1>Gestão de Centrais</h1><div id="sub" class="muted small">QR Code / ficha da central</div></div>
  <button id="loginBtn" class="secondary">Entrar</button>
</div></header>

<main class="wrap">
  <section id="login" class="card hidden">
    <h2>Entrar</h2>
    <p class="muted small">Use o utilizador autorizado do Supabase.</p>
    <div class="grid">
      <label>Email<input id="email" type="email" autocomplete="username"></label>
      <label>Palavra-passe<input id="password" type="password" autocomplete="current-password"></label>
    </div>
    <div class="row" style="margin-top:10px"><button id="signIn" class="primary">Entrar</button><button id="signOut" class="secondary hidden">Sair</button></div>
    <div id="loginMsg" class="small muted"></div>
  </section>

  <section id="home" class="card">
    <h2>Pesquisar central</h2>
    <p class="muted">Aponte a câmara ao QR Code ou escreva o código.</p>
    <div class="row">
      <input id="centralInput" placeholder="Ex.: CEN-Ed. A">
      <button id="openCentral" class="primary">Abrir</button>
      <button id="scanBtn" class="secondary">Ler QR</button>
    </div>
    <div id="reader" class="hidden"></div>
    <div id="homeMsg" class="small muted"></div>
  </section>

  <section id="central" class="hidden">
    <div class="card">
      <div class="top-actions">
        <div><h2 id="centralName">—</h2><div id="centralLocal" class="muted">—</div></div>
        <button id="back" class="secondary">Voltar</button>
      </div>
      <div style="margin-top:10px"><span id="status" class="status nodate">Sem data</span></div>
      <div id="centralPhotoBox" class="hidden" style="margin-top:12px"><img id="centralPhoto" class="photo"></div>
    </div>

    <div class="grid">
      <div class="stat"><div class="label">Última manutenção</div><div id="lastMaint" class="value">—</div></div>
      <div class="stat"><div class="label">Próxima manutenção</div><div id="nextMaint" class="value">—</div></div>
      <div class="stat"><div class="label">Zonas</div><div id="zoneCount" class="value">0</div></div>
      <div class="stat"><div class="label">Equipamentos</div><div id="equipCount" class="value">0</div></div>
    </div>

    <div class="card"><h3>Zonas</h3><div id="zones" class="list"></div></div>
    <div class="card"><h3>Manutenções</h3><div id="maintList" class="list"></div><button id="newMaint" class="primary">+ Nova manutenção</button></div>
    <div class="card"><h3>Intervenções</h3><div id="intList" class="list"></div><button id="newInt" class="primary">+ Nova intervenção</button></div>
  </section>

  <section id="form" class="card hidden">
    <div class="top-actions"><h2 id="formTitle">Novo registo</h2><button id="closeForm" class="secondary">Fechar</button></div>
    <div id="formFields"></div>
    <div class="row" style="margin-top:12px"><button id="saveForm" class="primary">Guardar</button></div>
    <div id="formMsg" class="small muted"></div>
  </section>
</main>

<script>
/* ==========================================================
   1) COLOQUE AQUI OS DADOS DO SEU PROJETO SUPABASE
   Supabase Dashboard > Project Settings > API
   ========================================================== */
const SUPABASE_URL = "https://ucygjxnzkikbadxvbiyy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5QFb8wU3xSjTFDbs_Ty-aw_X_Tlmq2-";

const ready = SUPABASE_ANON_KEY !== "COLOQUE_AQUI_A_ANON_KEY";
const db = ready ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const $ = id => document.getElementById(id);
let currentCentral = null, currentZones = [], currentEquipments = [], formMode = null;

function esc(v){return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function fmtDate(v){if(!v)return "—"; const [y,m,d]=String(v).slice(0,10).split("-"); return d&&m&&y?`${d}/${m}/${y}`:v;}
function statusFor(v){
  if(!v) return ["Sem data","nodate"];
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(String(v).slice(0,10)+"T00:00:00");
  const diff=Math.ceil((d-today)/86400000);
  if(diff<0) return ["EM ATRASO","late"];
  if(diff<=30) return ["ATENÇÃO","warn"];
  return ["OK","ok"];
}
function requireReady(){
  if(!ready){ alert("Falta configurar a ANON KEY do Supabase no index.html."); return false; }
  return true;
}
async function loadCentral(code){
  if(!requireReady()) return;
  code=(code||"").trim();
  if(!code)return;
  $("homeMsg").textContent="A carregar…";
  const {data:c,error}=await db.from("centrais").select("*").eq("id_central",code).maybeSingle();
  if(error){$("homeMsg").textContent=error.message;return;}
  if(!c){$("homeMsg").textContent="Central não encontrada: "+code;return;}
  currentCentral=c;
  $("homeMsg").textContent="";
  $("home").classList.add("hidden"); $("central").classList.remove("hidden"); $("form").classList.add("hidden");
  $("centralName").textContent=c.id_central||code;
  $("centralLocal").textContent=c.local_instalacao||"Local não preenchido";
  $("lastMaint").textContent=fmtDate(c.ultima_manutencao);
  $("nextMaint").textContent=fmtDate(c.proxima_manutencao);
  const [st,cl]=statusFor(c.proxima_manutencao); $("status").textContent=st; $("status").className="status "+cl;
  await loadZonesAndEquipment();
  await loadRecords();
}
async function loadZonesAndEquipment(){
  const {data:zones,error}=await db.from("zonas").select("*").eq("id_central",currentCentral.id_central).order("id_zona");
  if(error){$("zones").innerHTML=`<div class="muted">${esc(error.message)}</div>`;return;}
  currentZones=zones||[];
  $("zoneCount").textContent=currentZones.length;
  $("zones").innerHTML=currentZones.length?currentZones.map(z=>`<button data-zone="${esc(z.id_zona)}"><b>${esc(z.numero_zona||z.id_zona)}</b> — ${esc(z.designacao||z.descricao||"")}</button>`).join(""):"<div class='muted'>Ainda não existem zonas registadas.</div>";
  let equipments=[];
  for(const z of currentZones){
    const {data:links}=await db.from("equipamentos_zona").select("*").eq("id_zona",z.id_zona);
    for(const link of (links||[])){
      const eid=link.id_equipamento||link.codigo_equipamento;
      if(eid){
        const {data:e}=await db.from("equipamentos").select("*").eq("id_equipamento",eid).maybeSingle();
        if(e) equipments.push({...e,_id_zona:z.id_zona});
      }
    }
  }
  currentEquipments=equipments;
  $("equipCount").textContent=[...new Set(equipments.map(e=>e.id_equipamento||e.codigo_equipamento))].length;
  document.querySelectorAll("[data-zone]").forEach(b=>b.onclick=()=>showZone(b.dataset.zone));
}
async function showZone(zoneId){
  const z=currentZones.find(x=>String(x.id_zona)===String(zoneId));
  if(!z)return;
  const items=currentEquipments.filter(e=>String(e._id_zona)===String(zoneId));
  let html=`<div class="card"><h3>${esc(z.numero_zona||z.id_zona)} — ${esc(z.designacao||z.descricao||"")}</h3>`;
  html+=items.length?items.map(e=>`<div class="stat" style="margin:6px 0"><b>${esc(e.id_equipamento||e.codigo_equipamento||"Equipamento")}</b><br>${esc(e.descricao||e.local||e.descricao_local||"")}</div>`).join(""):"<div class='muted'>Sem equipamentos associados nesta zona.</div>";
  html+="</div>";
  const sec=document.createElement("section"); sec.innerHTML=html;
  sec.style.position="fixed";sec.style.inset="0";sec.style.background="#f4f6f8";sec.style.zIndex="20";sec.style.overflow="auto";
  sec.innerHTML=`<div class="wrap"><div class="top-actions"><h2>Zona</h2><button class="secondary" id="closeZone">Fechar</button></div>${html}</div>`;
  document.body.appendChild(sec);$("closeZone").onclick=()=>sec.remove();
}
async function loadRecords(){
  const id=currentCentral.id_central;
  const [m,i]=await Promise.all([
    db.from("manutencoes").select("*").eq("id_central",id).order("data",{ascending:false}),
    db.from("intervencoes").select("*").eq("id_central",id).order("data",{ascending:false})
  ]);
  $("maintList").innerHTML=(m.data||[]).length?(m.data||[]).map(x=>`<button><b>${fmtDate(x.data)}</b> — ${esc(x.tipo_manutencao||"Manutenção") }<br><span class="small">${esc(x.empresa_tecnico||"")}</span></button>`).join(""):"<div class='muted'>Sem manutenções registadas.</div>";
  $("intList").innerHTML=(i.data||[]).length?(i.data||[]).map(x=>`<button><b>${fmtDate(x.data)}</b> — ${esc(x.tipo||x.descricao||"Intervenção")}</button>`).join(""):"<div class='muted'>Sem intervenções registadas.</div>";
}
function openForm(mode){
  formMode=mode; $("form").classList.remove("hidden");
  $("formTitle").textContent=mode==="maintenance"?"Nova manutenção":"Nova intervenção";
  const eqOptions=currentEquipments.map(e=>`<option value="${esc(e.id_equipamento)}">${esc(e.id_equipamento)} — ${esc(e.descricao||e.local||"")}</option>`).join("");
  $("formFields").innerHTML=mode==="maintenance"?`
    <div class="grid">
      <label>Data<input id="f_data" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
      <label>Tipo<input id="f_tipo" placeholder="Ex.: Verificação anual"></label>
      <label>Empresa / técnico<input id="f_tec"></label>
      <label>Próxima manutenção<input id="f_next" type="date"></label>
    </div>
    <label style="display:block;margin-top:10px">Resultado / observações<textarea id="f_obs"></textarea></label>`
  :`
    <div class="grid">
      <label>Data<input id="f_data" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
      <label>Equipamento<select id="f_eq"><option value="">Selecionar…</option>${eqOptions}</select></label>
      <label>Tipo / anomalia<input id="f_tipo" placeholder="Ex.: Anomalia"></label>
    </div>
    <label style="display:block;margin-top:10px">Intervenção realizada<textarea id="f_obs"></textarea></label>`;
  $("formMsg").textContent="";
}
async function saveForm(){
  if(!requireReady())return;
  $("formMsg").textContent="A guardar…";
  let payload={id_central:currentCentral.id_central,data:$("f_data").value};
  if(formMode==="maintenance"){
    payload.id_manutencao="MAN-"+Date.now();
    payload.tipo_manutencao=$("f_tipo").value||null;
    payload.empresa_tecnico=$("f_tec").value||null;
    payload.proxima_manutencao=$("f_next").value||null;
    payload.observacoes=$("f_obs").value||null;
    const {error}=await db.from("manutencoes").insert(payload);
    if(error){$("formMsg").textContent=error.message;return;}
    if(payload.proxima_manutencao){
      await db.from("centrais").update({ultima_manutencao:payload.data,proxima_manutencao:payload.proxima_manutencao}).eq("id_central",currentCentral.id_central);
    }
  }else{
    payload.id_intervencao="INT-"+Date.now();
    payload.id_equipamento=$("f_eq").value||null;
    payload.tipo=$("f_tipo").value||null;
    payload.descricao=$("f_obs").value||null;
    const {error}=await db.from("intervencoes").insert(payload);
    if(error){$("formMsg").textContent=error.message;return;}
  }
  $("formMsg").textContent="Guardado com sucesso.";
  await loadCentral(currentCentral.id_central);
}
async function initAuth(){
  if(!ready)return;
  const {data:{session}}=await db.auth.getSession();
  $("signOut").classList.toggle("hidden",!session);
  db.auth.onAuthStateChange((_e,s)=>$("signOut").classList.toggle("hidden",!s));
}
$("openCentral").onclick=()=>loadCentral($("centralInput").value);
$("centralInput").addEventListener("keydown",e=>{if(e.key==="Enter")loadCentral($("centralInput").value)});
$("back").onclick=()=>{$("central").classList.add("hidden");$("home").classList.remove("hidden");};
$("newMaint").onclick=()=>openForm("maintenance");
$("newInt").onclick=()=>openForm("intervention");
$("closeForm").onclick=()=>$("form").classList.add("hidden");
$("saveForm").onclick=saveForm;
$("loginBtn").onclick=()=>$("login").classList.toggle("hidden");
$("signIn").onclick=async()=>{if(!requireReady())return; const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("loginMsg").textContent=error?error.message:"Entrada efetuada."};
$("signOut").onclick=async()=>{await db.auth.signOut();$("loginMsg").textContent="Sessão terminada."};
$("scanBtn").onclick=async()=>{
  if(!window.Html5Qrcode){$("homeMsg").textContent="O leitor QR ainda está a carregar. Tente novamente.";return;}
  $("reader").classList.remove("hidden");
  const qr=new Html5Qrcode("reader");
  await qr.start({facingMode:"environment"},{fps:10,qrbox:250},async txt=>{
    await qr.stop();$("reader").classList.add("hidden");
    try{const u=new URL(txt); const c=u.searchParams.get("central"); if(c)loadCentral(c); else loadCentral(txt);}
    catch{loadCentral(txt)}
  },()=>{});
};
initAuth();

const params=new URLSearchParams(location.search);
const code=params.get("central");
if(code) loadCentral(code);
</script>
</body>
</html>
